name: "Build and Test"

on:
  pull_request:
    types: [ "opened", "synchronize", "reopened", "closed" ]
  push:
    branches: [ "nixos-*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - run: nix flake check --print-build-logs
